name: Composer require (lock update)

on:
  push:
    paths:
      - '.github/composer-require.txt'

permissions:
  contents: write

jobs:
  require:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, gd, zip, intl, bcmath
          coverage: none
      - run: composer require $(cat .github/composer-require.txt) --no-interaction --no-progress -W
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock
          git commit -m "chore: composer require $(cat .github/composer-require.txt)" || echo "nothing to commit"
          git push
