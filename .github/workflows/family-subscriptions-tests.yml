name: Family subscriptions tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'database/**'
      - 'routes/**'
      - 'resources/views/family-subscriptions/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/family-subscriptions-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, gd, zip, intl, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: touch database/database.sqlite && cp .env.example .env && php artisan key:generate
      - name: Routes can be cached (production speed-up)
        run: php artisan route:cache && php artisan route:clear
      - name: Family store plans, coupons and receipts
        run: php artisan test tests/Feature/Api/FamilyStoreSubscriptionsTest.php tests/Feature/Api/FamilySubscriptionCouponsTest.php tests/Feature/Api/FamilySalesAndLimitsTest.php tests/Feature/Api/SaleReceiptsTest.php tests/Feature/Api/FamilyPlanDashboardTest.php tests/Feature/Api/CashierZadTest.php tests/Feature/Api/CashierInventoryTest.php tests/Feature/Api/CashierStaffTest.php tests/Feature/Api/CashierScreensTest.php tests/Feature/Api/DeviceLinkTest.php tests/Feature/Api/CashierOperationsTest.php tests/Feature/Api/ReceiptStyleTest.php tests/Feature/Api/ZatcaFlowTest.php tests/Feature/Api/ReturnsAccountabilityTest.php tests/Feature/Api/HomeTierOrderTest.php tests/Feature/Api/CashierSupplyTest.php tests/Feature/Api/ZatcaSandboxTest.php tests/Feature/SecurityProbeTest.php
